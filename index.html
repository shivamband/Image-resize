<!DOCTYPE html>
<html>
    <head>
        <meta name="google-site-verification" content="O0cQ2dy-duygJ2cLEqxE48-vj649p1-8FlxDzdkx7Po" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Image Forge Pro | PNG↔JPG, PDF↔Image, Resize & Size Control</title>
    <!-- PDF.js for PDF to image conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- jspdf for image to PDF conversion (more reliable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- FileSaver.js for saving blobs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 32px 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header p {
            opacity: 0.85;
            font-size: 0.95rem;
        }

        .content {
            padding: 40px;
        }

        .upload-area {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 2px dashed #cbd5e1;
            border-radius: 32px;

            text-align: center;

        .upload-area:hover {
            border-color: #667eea;
            background: #fefce8;
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-area input {
            display: none;
        }

        .preview-section {
            background: #f1f5f9;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 32px;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            margin: 16px 0;
        }

        .file-info {
            background: white;
            border-radius: 20px;
            padding: 12px 20px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: #334155;
            display: inline-block;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .control-group {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }

        .control-label {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-size: 0.9rem;
            background: white;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .dimension-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .quality-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .quality-row input {
            flex: 1;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 14px 28px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #1e293b;
            color: white;
        }

        .btn-secondary:hover {
            background: #0f172a;
            transform: translateY(-2px);
        }

        .result-area {
            margin-top: 32px;
            padding: 24px;
            background: linear-gradient(135deg, #fef9e3 0%, #fef3c7 100%);
            border-radius: 28px;
            display: none;
        }

        .result-area.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-preview {
            text-align: center;
            margin-bottom: 20px;
        }

        .result-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .result-info {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: #e2e8f0;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            margin: 4px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .content {
                padding: 24px;
            }
            .header {
                padding: 24px;
            }
            .btn {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-card">
        <div class="header">
            <h1>
                🎨 Image Forge Pro
            </h1>
            <p>Convert PNG ↔ JPG | PDF ↔ Image | Resize | Control Size (KB/MB) & Dimensions</p>
        </div>
        <div class="content">
            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <div>Click or drag & drop to upload</div>
                <div style="font-size: 0.8rem; margin-top: 8px; color: #64748b;">Supports: PNG, JPG, JPEG, PDF</div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg,application/pdf">
            </div>

            <!-- Preview Section -->
            <div class="preview-section" id="previewSection" style="display: none;">
                <div id="previewContent"></div>
            </div>

            <!-- Controls -->
            <div class="controls-grid">
                <div class="control-group">
                    <div class="control-label">
                        🔄 Conversion Type
                    </div>
                    <select id="convertType">
                        <option value="png-to-jpg">PNG ➜ JPG (JPEG)</option>
                        <option value="jpg-to-png">JPG/JPEG ➜ PNG</option>
                        <option value="pdf-to-img">PDF ➜ Image (PNG)</option>
                        <option value="img-to-pdf">Image ➜ PDF</option>
                    </select>
                </div>

                <div class="control-group">
                    <div class="control-label">
                        📏 Dimensions (px)
                    </div>
                    <div class="dimension-row">
                        <input type="number" id="widthInput" placeholder="Width (auto)" step="1">
                        <input type="number" id="heightInput" placeholder="Height (auto)" step="1">
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-label">
                        💾 Size & Quality Control
                    </div>
                    <div class="quality-row" style="margin-bottom: 12px;">
                        <input type="number" id="sizeLimit" placeholder="Target size" step="1">
                        <select id="sizeUnit" style="width: auto;">
                            <option value="KB">KB</option>
                            <option value="MB">MB</option>
                        </select>
                    </div>
                    <input type="number" id="jpegQuality" placeholder="JPEG Quality (1-100)" value="85" min="1" max="100" step="1">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-primary" id="processBtn">
                    ⚡ Convert & Resize
                </button>
                <button class="btn btn-secondary" id="downloadBtn" style="display: none;">
                    💾 Download Result
                </button>
            </div>

            <!-- Result Area -->
            <div class="result-area" id="resultArea">
                <div class="result-preview" id="resultPreview"></div>
                <div class="result-info" id="resultInfo"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    let currentFile = null;
    let currentResultBlob = null;
    let currentResultFilename = 'output';

    // DOM Elements
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const previewSection = document.getElementById('previewSection');
    const previewContent = document.getElementById('previewContent');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resultArea = document.getElementById('resultArea');
    const resultPreview = document.getElementById('resultPreview');
    const resultInfo = document.getElementById('resultInfo');
    const convertType = document.getElementById('convertType');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const sizeLimit = document.getElementById('sizeLimit');
    const sizeUnit = document.getElementById('sizeUnit');
    const jpegQuality = document.getElementById('jpegQuality');

    // Helper: Blob to Image
    function blobToImage(blob) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(img.src);
                resolve(img);
            };
            img.onerror = reject;
            img.src = URL.createObjectURL(blob);
        });
    }

    // Resize image with aspect ratio preservation
    async function resizeImage(imgElement, targetWidth, targetHeight) {
        return new Promise((resolve) => {
            const canvas = document.createElement('canvas');
            let width = imgElement.width;
            let height = imgElement.height;
            
            if (targetWidth && targetHeight) {
                width = targetWidth;
                height = targetHeight;
            } else if (targetWidth && !targetHeight) {
                height = (targetWidth / width) * height;
                width = targetWidth;
            } else if (!targetWidth && targetHeight) {
                width = (targetHeight / height) * width;
                height = targetHeight;
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgElement, 0, 0, width, height);
            resolve(canvas);
        });
    }

    // Apply file size constraint with binary search for JPEG
    async function constrainFileSizeByKB(blob, targetKB, baseQuality = 85) {
        if (!targetKB || targetKB <= 0) return blob;
        if (blob.size / 1024 <= targetKB) return blob;
        
        const mime = blob.type;
        if (!mime.includes('jpeg') && !mime.includes('jpg')) {
            console.warn("Size limiting works best with JPEG output");
            return blob;
        }
        
        let low = 10, high = Math.min(baseQuality, 95);
        let bestBlob = blob;
        
        const img = await blobToImage(blob);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        
        for (let i = 0; i < 8; i++) {
            const mid = Math.floor((low + high) / 2);
            const newBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', mid / 100));
            
            if (newBlob.size / 1024 <= targetKB) {
                bestBlob = newBlob;
                low = mid + 1;
            } else {
                high = mid - 1;
            }
            if (low > high) break;
        }
        return bestBlob;
    }

    // PDF to Image (first page)
    async function pdfToImageBlob(pdfFile, targetWidth, targetHeight) {
        const arrayBuffer = await pdfFile.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2.0 });
        
        let outputWidth = targetWidth || viewport.width;
        let outputHeight = targetHeight || (viewport.height * (outputWidth / viewport.width));
        
        if (targetWidth && targetHeight) {
            outputWidth = targetWidth;
            outputHeight = targetHeight;
        } else if (targetHeight && !targetWidth) {
            outputWidth = viewport.width * (outputHeight / viewport.height);
            outputHeight = targetHeight;
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = outputWidth;
        canvas.height = outputHeight;
        const ctx = canvas.getContext('2d');
        
        const renderContext = {
            canvasContext: ctx,
            viewport: page.getViewport({ scale: outputWidth / viewport.width }),
        };
        
        await page.render(renderContext).promise;
        
        return new Promise(resolve => {
            canvas.toBlob(resolve, 'image/png', 1.0);
        });
    }

    // Image to PDF using jsPDF (more reliable)
    async function imageToPdf(imageBlob, targetWidth, targetHeight, quality) {
        return new Promise(async (resolve, reject) => {
            try {
                const img = await blobToImage(imageBlob);
                
                // Get image dimensions
                let imgWidth = img.width;
                let imgHeight = img.height;
                
                // Apply resize if needed
                if (targetWidth || targetHeight) {
                    const canvas = await resizeImage(img, targetWidth, targetHeight);
                    imgWidth = canvas.width;
                    imgHeight = canvas.height;
                    const resizedBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality / 100));
                    const resizedImg = await blobToImage(resizedBlob);
                    imgWidth = resizedImg.width;
                    imgHeight = resizedImg.height;
                }
                
                // Calculate PDF dimensions (in points, 1px = 0.75pt at 96 DPI)
                const pdfWidth = imgWidth * 0.75;
                const pdfHeight = imgHeight * 0.75;
                
                // Create PDF with image dimensions
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: pdfWidth > pdfHeight ? 'landscape' : 'portrait',
                    unit: 'pt',
                    format: [pdfWidth, pdfHeight]
                });
                
                // Add image to PDF
                const imgData = await new Promise((res) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = imgWidth;
                    canvas.height = imgHeight;
                    const ctx = canvas.getContext('2d');
                    const tempImg = new Image();
                    tempImg.onload = () => {
                        ctx.drawImage(tempImg, 0, 0, imgWidth, imgHeight);
                        res(canvas.toDataURL('image/jpeg', quality / 100));
                    };
                    tempImg.src = URL.createObjectURL(imageBlob);
                });
                
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                const pdfBlob = pdf.output('blob');
                resolve(pdfBlob);
            } catch (error) {
                reject(error);
            }
        });
    }

    // Show loading state
    function showLoading(button) {
        const originalText = button.innerHTML;
        button.innerHTML = '<span class="loading"></span> Processing...';
        button.disabled = true;
        return () => {
            button.innerHTML = originalText;
            button.disabled = false;
        };
    }

    // Main processing function
    async function processFile() {
        if (!currentFile) {
            alert('Please select a file first');
            return;
        }

        const resetLoading = showLoading(processBtn);
        
        try {
            const convertTypeValue = convertType.value;
            let targetWidth = parseInt(widthInput.value) || null;
            let targetHeight = parseInt(heightInput.value) || null;
            let targetSize = parseFloat(sizeLimit.value);
            let unit = sizeUnit.value;
            let quality = parseInt(jpegQuality.value) || 85;
            quality = Math.min(100, Math.max(1, quality));

            let resultBlob = null;
            let extension = '';
            let mimeType = '';

            // Handle different conversions
            if (convertTypeValue === 'png-to-jpg') {
                const img = await blobToImage(currentFile);
                let canvas = await resizeImage(img, targetWidth, targetHeight);
                resultBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality / 100));
                extension = 'jpg';
                mimeType = 'image/jpeg';
            } 
            else if (convertTypeValue === 'jpg-to-png') {
                const img = await blobToImage(currentFile);
                let canvas = await resizeImage(img, targetWidth, targetHeight);
                resultBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                extension = 'png';
                mimeType = 'image/png';
            }
            else if (convertTypeValue === 'pdf-to-img') {
                if (!currentFile.type.includes('pdf')) {
                    alert('Selected file is not a PDF');
                    resetLoading();
                    return;
                }
                resultBlob = await pdfToImageBlob(currentFile, targetWidth, targetHeight);
                extension = 'png';
                mimeType = 'image/png';
            }
            else if (convertTypeValue === 'img-to-pdf') {
                if (!currentFile.type.includes('image')) {
                    alert('Selected file is not an image');
                    resetLoading();
                    return;
                }
                resultBlob = await imageToPdf(currentFile, targetWidth, targetHeight, quality);
                extension = 'pdf';
                mimeType = 'application/pdf';
            }

            if (!resultBlob) throw new Error('Conversion failed');

            // Apply size constraint if specified (only for JPEG outputs)
            let targetKB = targetSize ? targetSize : null;
            if (unit === 'MB' && targetKB) targetKB = targetKB * 1024;
            
            if (targetKB && targetKB > 0 && (mimeType === 'image/jpeg' || mimeType === 'image/jpg')) {
                resultBlob = await constrainFileSizeByKB(resultBlob, targetKB, quality);
            }

            currentResultBlob = resultBlob;
            currentResultFilename = `converted_${Date.now()}.${extension}`;

            // Display result
            displayResult(resultBlob, mimeType);
            downloadBtn.style.display = 'block';
        } catch (error) {
            console.error(error);
            alert('Error processing file: ' + error.message);
        } finally {
            resetLoading();
        }
    }

    // Display result preview
    function displayResult(blob, mimeType) {
        resultArea.classList.add('show');
        resultPreview.innerHTML = '';
        resultInfo.innerHTML = '';

        const sizeKB = (blob.size / 1024).toFixed(2);
        const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);

        if (mimeType.startsWith('image')) {
            const url = URL.createObjectURL(blob);
            const img = document.createElement('img');
            img.src = url;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '250px';
            img.style.borderRadius = '16px';
            resultPreview.appendChild(img);
            resultInfo.innerHTML = `
                <strong>✅ Conversion Complete!</strong><br>
                📦 Size: ${sizeKB} KB (${sizeMB} MB)<br>
                📄 Format: ${mimeType.split('/')[1].toUpperCase()}<br>
                💾 Click "Download Result" to save
            `;
        } else if (mimeType === 'application/pdf') {
            resultPreview.innerHTML = `
                <div style="font-size: 48px;">📄</div>
                <div style="margin-top: 12px;">PDF Document Ready</div>
            `;
            resultInfo.innerHTML = `
                <strong>✅ PDF Created Successfully!</strong><br>
                📦 Size: ${sizeKB} KB (${sizeMB} MB)<br>
                💾 Click "Download Result" to save your PDF
            `;
        }
    }

    // Preview uploaded file
    function previewFile(file) {
        if (!file) return;

        const fileType = file.type;
        previewSection.style.display = 'block';
        
        if (fileType.startsWith('image')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewContent.innerHTML = `
                    <img src="${e.target.result}" class="preview-image" alt="Preview">
                    <div class="file-info">
                        📁 ${file.name}<br>
                        📦 ${(file.size / 1024).toFixed(2)} KB (${(file.size / (1024 * 1024)).toFixed(2)} MB)<br>
                        🖼️ ${fileType.split('/')[1].toUpperCase()}
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        } else if (fileType === 'application/pdf') {
            previewContent.innerHTML = `
                <div style="font-size: 64px; margin: 20px;">📄</div>
                <div class="file-info">
                    📁 ${file.name}<br>
                    📦 ${(file.size / 1024).toFixed(2)} KB (${(file.size / (1024 * 1024)).toFixed(2)} MB)<br>
                    📄 PDF Document
                </div>
            `;
        }
    }

    // Download handler
    downloadBtn.addEventListener('click', () => {
        if (currentResultBlob) {
            saveAs(currentResultBlob, currentResultFilename);
        }
    });

    // File input change handler
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            currentFile = e.target.files[0];
            previewFile(currentFile);
            resultArea.classList.remove('show');
            downloadBtn.style.display = 'none';
            currentResultBlob = null;
        }
    });

    // Upload area click handler
    uploadArea.addEventListener('click', () => {
        fileInput.click();
    });

    // Drag and drop functionality
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#667eea';
        uploadArea.style.background = '#fefce8';
    });

    uploadArea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#cbd5e1';
        uploadArea.style.background = 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)';
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#cbd5e1';
        uploadArea.style.background = 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)';
        
        const files = e.dataTransfer.files;
        if (files && files[0]) {
            currentFile = files[0];
            fileInput.files = files;
            previewFile(currentFile);
            resultArea.classList.remove('show');
            downloadBtn.style.display = 'none';
            currentResultBlob = null;
        }
    });

    // Process button click
    processBtn.addEventListener('click', processFile);
</script>
</body>
</html>
